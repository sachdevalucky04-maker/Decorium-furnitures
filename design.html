<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Design - Decorium Furnitures</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Request a Custom Design</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="design.html">Request Design</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <section class="content">
        <h2>Tell Us What You Want</h2>
        <p>Upload your idea or describe your preferred furniture design.</p>

        <form class="design-form">

            <label>Your Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Phone Number</label>
            <input type="text" placeholder="Enter phone number">

            <label>Furniture Type</label>
            <input type="text" placeholder="Ex: Sofa, Bed, Table">

            <label>Upload Design Image</label>
            <input type="file">

            <label>Description</label>
            <textarea placeholder="Describe your design idea..."></textarea>

            <button type="submit">Submit Request</button>
        </form>
    </section>

    <footer>
        <p>© 2025 Decorium Furnitures</p>
    </footer>

</body>

</html>
